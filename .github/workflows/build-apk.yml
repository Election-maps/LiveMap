name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Copy APK to root for GitHub Pages
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SrikakulamPoliceTracker.apk
          ls -la SrikakulamPoliceTracker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SrikakulamPoliceTracker
          path: SrikakulamPoliceTracker.apk

      - name: Commit APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SrikakulamPoliceTracker.apk
          git commit -m "Automated build: SrikakulamPoliceTracker.apk [skip ci]" || echo "No changes to commit"
          git push origin main
